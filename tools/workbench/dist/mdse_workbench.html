    const st = structure(ix, sel), flat                                   = [];
    const walk = (t          , level        )       => {
      flat.push({ level: String(level), name: { text: "\u00a0\u00a0".repeat(level) + t.label, path: t.path }, role: t.kind === "root" ? "this note" : t.kind.replace(/^has/, "").toLowerCase(), mult: t.detail && !t.path ? "" : t.detail, type: t.path ? (ix.notes.get(t.path)?.type ?? "") : "not in vault", id: t.path ? (ix.notes.get(t.path)?.id ?? "") : "", note: t.path ? "" : t.detail });
      for (const c of t.children) walk(c, level + 1);
    };
    walk(st.tree, 0);
    out.push({ id: "structure", title: `Structure of ${n.title}`, columns: [{ key: "name", label: "Element" }, { key: "role", label: "Role" }, { key: "mult", label: "Qty" }, { key: "type", label: "Type" }, { key: "id", label: "Id", wide: true }, { key: "note", label: "Note", wide: true }], rows: flat, empty: "This definition owns no usages.",
      note: [st.supers.length ? "Specializes " + st.supers.map((p) => nm(ix, p, p)).join(" → ") : "", st.subs.length ? "Specialized by " + st.subs.map((p) => nm(ix, p, p)).join(", ") : "", st.untyped.length ? "Untyped: " + st.untyped.join(", ") : ""].filter(Boolean).join(" · ") });
    const b = bom(ix, sel);
    out.push({ id: "bom", title: "Parts list (rolled up)", columns: [{ key: "part", label: "Part" }, { key: "qty", label: "Quantity" }, { key: "depth", label: "Depth" }], rows: b.map((x) => ({ part: C(ix, x.path), qty: String(x.qty), depth: String(x.depth) })), empty: "No resolved parts under this note." });
    const w = whereUsed(ix, sel), up                                   = [];
    const walkUp = (t          , level        )       => { for (const c of t.children) { up.push({ assembly: { text: "\u00a0\u00a0".repeat(level) + c.label, path: c.path }, via: c.kind.replace(/^has/, "").toLowerCase(), qty: c.detail }); walkUp(c, level + 1); } };
    walkUp(w.tree, 0);
    out.push({ id: "where", title: `Where ${n.title} is used`, columns: [{ key: "assembly", label: "Assembly" }, { key: "via", label: "Relationship" }, { key: "qty", label: "Qty" }], rows: up, empty: "Nothing owns, specializes or performs this note.", note: w.references.length ? `${w.references.length} other reference(s): ` + w.references.map((r) => `${r.kind} from ${nm(ix, r.path, r.path)}`).join("; ") : "" });
  } else if (lens === "functional") {
    const all = functionalTrace(ix), rows = scope === "selected" && has ? all.filter((r) => funcRelated(r, sel)) : all;
    out.push({ id: "functional", title: scope === "selected" && has ? `Functional trace around ${n .title}` : "Functional trace (all functions)", columns: [{ key: "fn", label: "Function" }, { key: "by", label: "Performed by" }, { key: "sat", label: "Satisfies" }, { key: "ver", label: "Verified by", wide: true }, { key: "alloc", label: "Allocated to", wide: true }, { key: "act", label: "Actions", wide: true }, { key: "gaps", label: "Gaps" }],
      rows: rows.map((r) => ({ fn: { text: (r.id ? r.id + "  " : "") + r.title, path: r.path }        , by: Cs(ix, r.performedBy), sat: [...Cs(ix, r.satisfies), ...Cs(ix, r.satisfiesViaPerformer).map((c) => ({ ...c, text: c.text + " (via performer)" }))], ver: Cs(ix, r.verifiedBy), alloc: Cs(ix, r.allocatedTo), act: r.actions.join(", "), gaps: { text: r.gaps.join(", "), cls: r.gaps.length ? "gap" : "" } })                                        ), empty: has && scope === "selected" ? "No functions are related to this note." : "No Behavior notes in the vault.",
      note: `${all.length} function(s) in the vault; ${all.filter((r) => r.gaps.length).length} with gaps.` });
  } else if (lens === "requirements") {
    const t = traceMatrix(ix), rows = scope === "selected" && has ? t.rows.filter((r) => traceRelated(r, sel)) : t.rows;
    out.push({ id: "requirements", title: scope === "selected" && has ? `Requirements trace around ${n .title}` : "Requirements trace (all requirements)", columns: [{ key: "req", label: "Requirement" }, { key: "sub", label: "Subtype" }, { key: "txt", label: "Text", wide: true }, { key: "sat", label: "Satisfied by" }, { key: "ver", label: "Verified by" }, { key: "from", label: "Derived from", wide: true }, { key: "der", label: "Derives", wide: true }, { key: "alloc", label: "Allocated to", wide: true }, { key: "gaps", label: "Gaps" }],
      rows: rows.map((r) => ({ req: { text: (r.id ? r.id + "  " : "") + r.title, path: r.path }        , sub: r.subtype, txt: r.text, sat: Cs(ix, r.satisfiedBy), ver: Cs(ix, r.verifiedBy), from: Cs(ix, r.derivedFrom), der: Cs(ix, r.derives), alloc: Cs(ix, r.allocatedTo), gaps: { text: r.gaps.join(", "), cls: r.gaps.length ? "gap" : "" } })                                        ), empty: has && scope === "selected" ? "No requirements are related to this note." : "No requirements in the vault.",
      note: `${t.total} requirement(s): ${t.satisfied} satisfied, ${t.verified} verified.` });
  } else if (lens === "tables") {
    const which = o.table ?? "relationships";
    if (which === "notes") {
      const rows = tableRows(ix, { ...(o.text ? { text: o.text } : {}), sort: "id" });
      out.push({ id: "notes", title: "Notes", columns: [{ key: "id", label: "Id" }, { key: "title", label: "Title" }, { key: "type", label: "Type" }, { key: "status", label: "Status" }, { key: "folder", label: "Folder", wide: true }, { key: "flags", label: "Flags" }, { key: "dangling", label: "Unresolved", wide: true }], rows: rows.map((r) => ({ id: r.id, title: { text: r.title, path: r.path }        , type: r.type + (r.subtype ? "/" + r.subtype : ""), status: r.status, folder: r.folder, flags: String(r.flags || ""), dangling: String(r.dangling || "") })), empty: "No notes match." });
    } else if (which === "usages") {
      const u = n?.def?.usages ?? [];
      out.push({ id: "usages", title: n ? `Usages in ${n.title}` : "Usages", columns: [{ key: "kind", label: "Kind" }, { key: "name", label: "Name" }, { key: "type", label: "Type" }, { key: "mult", label: "Multiplicity" }], rows: u.map((x) => ({ kind: (x.dir ? x.dir + " " : "") + x.kind, name: x.name, type: x.type ? ({ text: ix.bySymbol.get(x.type) ? nm(ix, ix.bySymbol.get(x.type) , x.type) : x.type + " (not in vault)", path: ix.bySymbol.get(x.type) ?? null }        ) : { text: "untyped", cls: "gap" }        , mult: x.mult ?? "" })), empty: n ? "No usages." : "Select a note." });
    } else {
      const rows = relationshipRows(ix, [], o.text ?? "").filter((r) => !sel || scope === "all" || r.from === sel || r.to === sel);
      out.push({ id: "relationships", title: sel && scope === "selected" ? `Relationships of ${n?.title ?? "note"}` : "All relationships", columns: [{ key: "from", label: "From" }, { key: "kind", label: "Kind" }, { key: "to", label: "To" }, { key: "label", label: "Label", wide: true }], rows: rows.map((r) => ({ from: r.from === null ? { text: r.fromTitle + " (not in vault)", cls: "gap" }         : { text: r.fromTitle, path: r.from }        , kind: r.kind, to: r.resolved || r.from === null ? { text: r.toTitle, path: r.to }         : { text: r.toTitle + " (not in vault)", cls: "gap" }        , label: r.label })), empty: "No relationships." });
    }
  }
  return out;
}

/* canvas.ts */
/* Obsidian Canvas export (JSON Canvas 1.0). A canvas is a generated, disposable picture of one traversal: file cards for
 * notes in the vault, text cards for references whose note is not in the vault. It carries no model meaning (D-0003);
 * regenerate it any time. Layout is layered left to right by distance from the start note. */




                                                                                                                                                             
                                                                                                                                                                                                                 
                                                                
                                                                                                                                               

/** Temporary views: one scratch file, overwritten by every preview and deleted when the plugin loads or unloads. Git-ignored. */
const PREVIEW_DIR = "99_System/22_Views";
const PREVIEW_PATH = `${PREVIEW_DIR}/Workbench Preview.canvas`;
/** Saved views: where Save canvas offers to put a canvas first (the person can pick any folder). Committed like any other file. */
const SAVED_DIR = "99_System/23_Saved_Views";
const W = 280, H = 90, GX = 120, GY = 40, MAX_UNRESOLVED = 24;
const safe = (s        )         => s.replace(/[\\/:*?"<>|#^[\]]/g, " ").replace(/\s+/g, " ").trim().slice(0, 80) || "Untitled";

const hash = (s        )         => { let h = 5381; for (const c of s) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return h.toString(16).slice(0, 4); };

/** `spec` is the person's view settings (filters, hops, relationship kinds, grouping); omitted means the profile's defaults. */
function toCanvas(ix            , start        , profile         , spec                    )               {
  const sp = { ...defaultSpec(profile), ...spec }, depth = sp.depth, cap = sp.cap;
  const note = ix.notes.get(start);
  if (!note) throw new Error(`Note not in index: ${start}`);
  const g = traverse(ix, start, profile, depth, cap, sp);
  const id = new Map                (g.nodes.map((n, i) => [n.path, `n${i}`]));
  const allow = (e      , dir              )          => sp.kinds.length ? sp.kinds.includes(e.kind) : !profile.steps.length || profile.steps.some((s) => s.kind === e.kind && s.dir === dir);

  // text cards for references whose note is not in the vault (partial vaults, dangling links)
  const ghosts                                                                   = [];
  let unresolved = 0;
  for (const n of sp.ghosts ? g.nodes : []) {
    if (n.depth >= depth || g.groups.has(n.path)) continue;
    for (const e of outgoing(ix, n.path)) {
      if (e.to || !allow(e, e.reverse ? "in" : "out")) continue;
      unresolved++;
      if (ghosts.length < MAX_UNRESOLVED) ghosts.push({ key: `g${ghosts.length}`, text: e.toSymbol, anchor: n.path, edge: e });
    }
  }

  // layered layout: one column per depth, rows stacked and centred
  const cols = new Map                                                              ();
  for (const n of g.nodes) (cols.get(n.depth) ?? cols.set(n.depth, []).get(n.depth) ).push({ key: id.get(n.path) , path: n.path });
  const depthOf = new Map(g.nodes.map((n) => [n.path, n.depth]));
  for (const x of ghosts) (cols.get((depthOf.get(x.anchor) ?? 0) + 1) ?? cols.set((depthOf.get(x.anchor) ?? 0) + 1, []).get((depthOf.get(x.anchor) ?? 0) + 1) ).push({ key: x.key, text: x.text });
  const nodes               = [], at = new Map                    ();
  const make = (it                                               )             => {
    const base = { id: it.key, x: 0, y: 0, width: W, height: H };
    const grp = it.path ? g.groups.get(it.path) : undefined;
    if (grp) {
      const shown = grp.members.slice(0, 12).map((m) => `- [[${m.replace(/\.md$/i, "")}|${ix.notes.get(m) .title.replace(/[|\]]/g, " ")}]]`), color = TYPE_COLOR[grp.type];
      return { ...base, type: "text", height: 70 + shown.length * 26 + (grp.members.length > 12 ? 26 : 0), text: `**${grp.label} ×${grp.members.length}**\n\n${shown.join("\n")}${grp.members.length > 12 ? `\n- … ${grp.members.length - 12} more` : ""}`, ...(color ? { color } : {}) };
    }
    if (it.path && isRequirement(ix.notes.get(it.path) )) {                    // requirements show name, subtype and wording on the card (IMP-097)
      const n = ix.notes.get(it.path) , txt = requirementText(n), color = TYPE_COLOR[n.type];
      const clip = txt.length > 600 ? txt.slice(0, 600).trimEnd() + " …" : txt;
      return { ...base, type: "text", height: Math.min(520, 110 + Math.ceil(clip.length / 38) * 22), text: `**[[${n.path.replace(/\.md$/i, "")}|${n.title.replace(/[|\]]/g, " ")}]]**${n.subtype ? ` · ${n.subtype}` : ""}\n\n${clip || "_no requirement text_"}`, ...(color ? { color } : {}) };
    }
    if (it.path) { const color = TYPE_COLOR[ix.notes.get(it.path) .type]; return { ...base, type: "file", file: it.path, ...(color ? { color } : {}) }; }
    return { ...base, type: "text", text: `${it.text}\n\n_not in vault_`, color: "1" };
  };
  for (const [d, list] of [...cols].sort((a, b) => a[0] - b[0])) {
    const cards = list.map((it) => ({ it, cn: make(it) })), total = cards.reduce((s, c) => s + c.cn.height + GY, -GY);
    let y = -total / 2;
    for (const { it, cn } of cards) { cn.x = d * (W + GX); cn.y = Math.round(y); y += cn.height + GY; nodes.push(cn); at.set(it.key, cn); }
  }

  const edges               = [];
  const side = (a            , b            )                                                                     =>
    b.x > a.x ? { fromSide: "right", toSide: "left" } : b.x < a.x ? { fromSide: "left", toSide: "right" } : b.y >= a.y ? { fromSide: "bottom", toSide: "top" } : { fromSide: "top", toSide: "bottom" };
  const push = (from        , to        , e      )       => {
    const a = at.get(from), b = at.get(to); if (!a || !b) return;
    edges.push({ id: `e${edges.length}`, fromNode: from, toNode: to, ...side(a, b), toEnd: "arrow", label: [e.kind, e.label].filter(Boolean).join(" ").slice(0, 60) });
  };
  for (const e of g.edges) push(id.get(e.from) , id.get(e.to ) , e);
  for (const x of ghosts) { const anchor = id.get(x.anchor) ; if (x.edge.reverse) push(x.key, anchor, x.edge); else push(anchor, x.key, x.edge); }

  return { doc: { nodes, edges }, notes: g.nodes.length, unresolved, capped: g.capped || unresolved > ghosts.length, fileName: `${safe(note.title)} - ${safe(profile.name)}${specIsDefault(spec, profile) ? "" : " [" + hash(JSON.stringify(sp)) + "]"}.canvas`, groups: g.groups.size, hidden: g.hidden };
}

/* edit.ts */
/* Edit plans (D-0030): adding an element and adding a relationship. Pure functions: each takes the index and the person's
 * choices and returns an EditPlan (the files to write, with before and after text). Nothing is written here; the Obsidian
 * shell shows the preview and applies the plan (WKB-006). SysML-defined content goes only into the `## SysML v2` block
 * (D-0003); a new note gets uid, id, status and the SysML block, nothing else. */


                                                                                                   
                                                                               
                                                                                                 
                                         

const bad = (problem        )           => ({ summary: "", writes: [], problems: [problem] });

/* ---- identifiers --------------------------------------------------------------------------------------------- */
const ED_KEYWORDS = new Set("about abstract accept action actor after alias all allocate allocation analysis and as assert assign assume at attribute bind binding by calc case comment concern connect connection constraint decide def default defined dependency derived do doc else end entry enum event exhibit exit expose false filter first flow for fork frame from if import in include individual inout interface join language merge message meta metadata nonunique not null objective occurrence of or ordered out package parallel part perform port private protected public redefines ref references render rendering rep require requirement return satisfy send snapshot specializes stakeholder state subject subsets succession then timeslice to transition true until use variant variation verification verify via view viewpoint when while xor".split(" "));
function edIdent(raw        , fallback = "Unnamed")         {
  let s = raw.normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, " ").trim().split(" ").filter(Boolean).map((w) => w[0] .toUpperCase() + w.slice(1)).join("");
  if (!s) s = fallback;
  if (/^[0-9]/.test(s)) s = "_" + s;
  return ED_KEYWORDS.has(s) ? s + "_" : s;
}
const edUsageIdent = (raw        , fallback = "item")         => { const s = edIdent(raw, fallback); const l = s[0] .toLowerCase() + s.slice(1); return ED_KEYWORDS.has(l) ? l + "_" : l; };
function edFileName(raw        )         {
  const s = raw.replace(/\r?\n/g, " ").replace(/\//g, "-").replace(/:/g, " -").replace(/[?*]/g, "").replace(/"/g, "''").replace(/[<>|\\]/g, "-").replace(/\[/g, "(").replace(/\]/g, ")").replace(/#/g, "no.").replace(/\^/g, "")
    .replace(/\s+/g, " ").trim().replace(/[. ]+$/, "");
  return s.length > 150 ? s.slice(0, 150).trim() : s;
}
/** `author: <code>` from .vault.yaml; "" when not set yet. */
function edAuthor(vaultYaml        )         { const a = /^author:\s*(\S+)/m.exec(vaultYaml)?.[1] ?? ""; return a === "UNINITIALIZED" || a.length !== 13 ? "" : a; }
/** yyyyMMddHHmmssSSS in LOCAL time (MOD-004) plus the 13-character author code; a repeat moves forward one millisecond. */
function edUid(author        , now      , taken             )         {
  const p = (n        , w = 2)         => String(n).padStart(w, "0");
  let t = now.getTime();
  for (;;) {
    const d = new Date(t), uid = `${p(d.getFullYear(), 4)}${p(d.getMonth() + 1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${p(d.getMilliseconds(), 3)}${author}`;
    if (!taken.has(uid)) return uid;
    t++;
  }
}
/** Prefix plus the highest existing number plus one (MOD-007). */
function edNextId(ix            , prefix        )         {
  let max = 0;
  const re = new RegExp(`^${prefix}-(\\d+)$`);
  for (const id of ix.byId.keys()) { const m = re.exec(id); if (m) max = Math.max(max, Number(m[1])); }
  return `${prefix}-${String(max + 1).padStart(5, "0")}`;
}

/* ---- element kinds ------------------------------------------------------------------------------------------- */
/** SysML definition keyword written for a new note of this class; null = the class has no SysML form (plain note). */
function edKeyword(type        , subtype        )                {
  switch (type) {
    case "Object": return subtype === "interface" ? "interface def" : "part def";
    case "Actor": return "part def";
    case "Behavior": return "action def";
    case "Condition": return "state def";
    case "Requirement": return "requirement def";
    case "Use Case": return "use case def";
    case "Verification": return "verification def";
    case "Item Flow": return "item def";
    default: return null;
  }
}
/** Classes a person may add, with their subtypes (modelCheck is importer-only). */
function edElementKinds(classes           )                                                                      {
  return Object.keys(classes).filter((t) => t !== "modelCheck").sort().map((type) => ({ type, subtypes: classes[type] .subtype, keyword: edKeyword(type, classes[type] .subtype[0] ?? "") }));
}

                                                                                                                                                                                  
function planAddElement(ix            , classes           , o            )           {
  const cls = classes[o.type];
  if (!cls) return bad(`Unknown class "${o.type}".`);
  if (cls.subtype.length && !cls.subtype.includes(o.subtype)) return bad(`"${o.subtype}" is not a subtype of ${o.type}.`);
  const title = o.title.replace(/\s+/g, " ").trim();
  if (!title) return bad("A name is required.");
  if (!o.author) return bad("No author code yet: set `author:` in .vault.yaml (the importer fills it on its first run).");
  const base = edFileName(title);
  if (!base) return bad("The name has no usable characters.");
  const folder = o.folder.replace(/^\/+|\/+$/g, "");
  const taken = new Set([...ix.notes.keys()].map((p) => p.toLowerCase())), names = new Set([...ix.notes.values()].map((n) => n.name.toLowerCase()));
  let name = base, n = 1;
  while (names.has(name.toLowerCase()) || taken.has(((folder ? folder + "/" : "") + name + ".md").toLowerCase())) { n++; name = `${base}~${n}`; }
  const path = (folder ? folder + "/" : "") + name + ".md";
  const prefix = cls.prefixBySubtype?.[o.subtype] ?? cls.prefix, id = edNextId(ix, prefix);
  const uid = edUid(o.author, o.now ?? new Date(), new Set([...ix.notes.values()].map((x) => x.uid)));
  const kw = edKeyword(o.type, o.subtype), pkg = id.replace(/-/g, "_"), ident = edIdent(title, "Unnamed"), text = (o.text ?? "").replace(/\r\n/g, "\n").trim();
  const fm = [`type: ${o.type}`, `subtype:${o.subtype ? " " + o.subtype : ""}`, `id: ${id}`, `uid: ${uid}`, "status: Draft", "tags: []"];
  if (kw) fm.push("sourceRole: authoritative-model", `primarySymbol: ${pkg}::${ident}`);
  let out = `---\n${fm.join("\n")}\n---\n# ${title}\n`;
  if (text && !(kw === "requirement def")) out += `\n${text}\n`;                                          // a requirement's wording lives in its doc (IMP-097)
  if (kw) {
    const doc = kw === "requirement def" && text ? `        doc /* ${text.replace(/\*\//g, "* /").split("\n").join("\n           ")} */\n` : "";
    const def = doc ? `    ${kw} ${ident} {\n${doc}    }` : `    ${kw} ${ident};`;
    out += `\n\n\n${MDSE.renderSysmlSection(`package ${pkg} {\n${def}\n}\n`)}`;
  }
  return { summary: `Add ${o.type}${o.subtype ? "/" + o.subtype : ""} "${title}" (${id}) as ${path}.`, writes: [{ path, before: null, after: out }], problems: [] };
}

/* ---- locating a definition in the block ------------------------------------------------------------------- */
/** Index just past the `}` that closes the brace at `open`, skipping comments and strings; -1 when unbalanced. */
function edCloseOf(s        , open        )         {
  let depth = 0;
  for (let i = open; i < s.length; i++) {
    const c = s[i] ;
    if (c === "/" && s[i + 1] === "*") { const e = s.indexOf("*/", i + 2); if (e < 0) return -1; i = e + 1; continue; }
    if (c === "/" && s[i + 1] === "/") { const e = s.indexOf("\n", i); if (e < 0) return -1; i = e; continue; }
    if (c === '"') { const e = s.indexOf('"', i + 1); if (e < 0) return -1; i = e; continue; }
    if (c === "{") depth++;
    else if (c === "}") { depth--; if (depth === 0) return i + 1; }
  }
  return -1;
}
                                                                                                                  
function edFindDef(block        , keyword        , name        )                 {
  const re = new RegExp(`(^|\\n)([ \\t]*)((?:abstract\\s+)?${keyword.replace(/ /g, "\\s+")}\\s+)(${name})\\b([^{;\\n]*)([{;])`);
  const m = re.exec(block);
  if (!m) return null;
  const term = m.index + m[0] .length - 1, nameEnd = m.index + m[1] .length + m[2] .length + m[3] .length + m[4] .length;
  if (m[6] === ";") return { indent: m[2] , headEnd: term, nameEnd, term, open: false, close: -1 };
  const close = edCloseOf(block, term);
  return close < 0 ? null : { indent: m[2] , headEnd: term, nameEnd, term, open: true, close: close - 1 };
}

/** Appends one member statement inside the definition (turning `kw Name;` into `kw Name { … }`). */
function edInsert(block        , d                          , stmt        )                {
  const at = edFindDef(block, d.keyword, d.name);
  if (!at) return null;
  const pad = at.indent + "    ";
  if (!at.open) return block.slice(0, at.term) + ` {\n${pad}${stmt}\n${at.indent}}` + block.slice(at.term + 1);
  const before = block.slice(0, at.close).replace(/[ \t]*$/, "");
  return before + (before.endsWith("\n") ? "" : "\n") + `${pad}${stmt}\n${at.indent}` + block.slice(at.close);
}

function edWithBlock(note      , text        , fn                                  )                                         {
  const block = MDSE.extractSysml(text)                 ;
  if (!block || !note.def) return { problem: `"${note.title}" has no SysML block to edit.` };
  const next = fn(block);
  if (next === null) return { problem: `Could not find "${note.def.keyword} ${note.def.name}" in the SysML block of "${note.title}".` };
  if (next === block) return { problem: "Nothing to change: the block already says this." };
  return { text: MDSE.replaceSysmlBlock(text, next) };
}

/* ---- relationships ---------------------------------------------------------------------------------------- */
                 
                                          
                                                                   
                                          
                                                                 
 
const kw = (n      )         => n.def?.keyword ?? "";

    return edInsert(block, n.def , doc);

/** Lines that differ, for the preview: common leading and trailing lines are dropped. */
function edDiff(before               , after        )                                         {
  if (before === null) return { removed: [], added: after.split("\n") };
  const a = before.split("\n"), b = after.split("\n");
  let s = 0; while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let ea = a.length, eb = b.length; while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) { ea--; eb--; }
  return { removed: a.slice(s, ea), added: b.slice(s, eb) };
}

async function readZip(buf             )                               {

    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("ZIP central directory is damaged.");

  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  const h = item && item.getAsFileSystemHandle ? await item.getAsFileSystemHandle() : null;
  if (h && h.kind === "directory") return load(h.name, () => WB.readDirHandle(h));
  const f = e.dataTransfer.files[0];
  if (f && /\.zip$/i.test(f.name)) return load(f.name, async () => WB.readZip(await f.arrayBuffer()));
  say("Drop a vault folder (Chrome or Edge) or an MDSE.zip.", true);
});
addEventListener("error", (e) => say("Page error: " + e.message, true));
addEventListener("unhandledrejection", (e) => say("Page error: " + (e.reason && e.reason.message || e.reason), true));
</script></body></html>
