<style>html,body{margin:0;height:100%}body{display:flex;flex-direction:column;font:14px system-ui,sans-serif}#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #8884}#root{flex:1;min-height:0}#msg{font-size:13px}#bar button,#bar label.btn{font:inherit;padding:5px 12px;border:1px solid #8886;border-radius:6px;cursor:pointer;background:transparent;color:inherit}#drop{outline:3px dashed #2557d6;outline-offset:-6px}.bad{color:#b3261e}@media (prefers-color-scheme:dark){html{background:#14171d;color:#e6e9ef}.bad{color:#ff8a80}}</style></head>
<body><div id="bar"><b>MDSE Workbench</b><button id="pick">Open vault folder</button><label class="btn">Choose folder (any browser)<input id="dir" type="file" webkitdirectory multiple hidden></label><label class="btn">Open MDSE.zip<input id="zip" type="file" accept=".zip" hidden></label><span id="msg">Read-only. Nothing leaves this page. Drop a folder or an MDSE.zip anywhere.</span></div>
<div id="root"></div>
<script>
/* MDSE v2 importer core. Pure functions, no DOM, no network, no dependencies.
 * Inlined into mdse_v2_importer.html by build_importer_html.mjs and unit-tested under node.
 * The note rules mirror testing/oracles/mdse_note_format.py (ADR-V2-06); CI cross-checks the two. */
const MDSE = (() => {
  const SYSML_HEADING = "## SysML v2", SOURCE_HEADING = "## Source: EA";
  const SYSML_HINT = "> **Authoritative SysML v2 text.** Write your notes above this section. " +
    "Change the model through Workbench, or edit this block and re-run the parser check.";
  const UID = /^\d{17}[a-z-]{13}$/, ID = /^([A-Z]+)-(\d{5})$/;
  const FIXTURE_ID_MIN = 99000;
  const PROPERTY_ORDER = ["type", "subtype", "id", "uid", "status", "eaType", "tags"];
  const FENCE_OPEN = /^```sysml[ \t]*$/;
  const COMMENT_ONLY = /^\s*(<!--[\s\S]*?-->\s*)*$/;
  // Keys the importer owns on rerun. Everything else in frontmatter belongs to people.
  const EA_OWNED_KEYS = ["subtype", "eaType", "sourceRole", "primarySymbol"];

  const scalar = (raw) => { raw = raw.trim(); if (raw.length >= 2 && raw[0] === raw[raw.length - 1] && "\"'".includes(raw[0])) raw = raw.slice(1, -1); return raw; };

  function parse(text) {
    const norm = text.replace(/\r\n/g, "\n");
    if (!norm.startsWith("---\n")) throw new Error("MISSING_FRONTMATTER");
    let end = norm.indexOf("\n---\n", 3);
    const tailEnd = norm.length;
    if (end === -1) {
      const t = norm.replace(/\n+$/, "");
      if (t.endsWith("\n---")) end = t.lastIndexOf("\n---"); else throw new Error("MISSING_FRONTMATTER");
    }
    const keys = [], meta = {};
    for (const line of norm.slice(4, end).split("\n")) {
      const m = /^([A-Za-z][\w-]*):(.*)$/.exec(line);
      if (m) { keys.push(m[1]); meta[m[1]] = scalar(m[2]); }
    }
    const fmEnd = Math.min(end + 5, tailEnd);
    const h2 = []; let inFence = false, pos = 0;
    for (const line of norm.split("\n")) {
      if (line.trimStart().startsWith("```")) inFence = !inFence;
      else if (!inFence && line.startsWith("## ") && pos >= fmEnd) h2.push([pos, line.trimEnd()]);
      pos += line.length + 1;
    }
    return { text: norm, keys, meta, fmEnd, h2, fmBlockEnd: end };
  }
  const sectionOffsets = (n, heading) => n.h2.map(([off, h], i) => [i, off, h]).filter((x) => x[2] === heading).map((x) => [x[0], x[1]]);
  function sectionText(n, heading) {
    const hits = sectionOffsets(n, heading); if (!hits.length) return null;
    const [i, off] = hits[0]; const stop = i + 1 < n.h2.length ? n.h2[i + 1][0] : n.text.length;
    return n.text.slice(off, stop);
  }
  function fences(section) {
    const out = [], lines = section.split("\n"); let i = 0;
    while (i < lines.length) {
      if (FENCE_OPEN.test(lines[i])) {
        let j = i + 1; while (j < lines.length && lines[j].trimEnd() !== "```") j++;
        const body = lines.slice(i + 1, j).join("\n") + "\n";
        let k = j + 1; while (k < lines.length && !FENCE_OPEN.test(lines[k])) k++;
        out.push([body, lines.slice(j + 1, k).join("\n")]);
        i = Math.max(k, j + 1);
      } else i++;
    }
    return out;
  }
  function qualifiedNames(sysml) {
    const src = sysml.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/[^\n]*/g, "");
    const tok = /\{|\}|;|\bpackage\s+(\w+)|\b(?:\w+\s+)*?def\s+(\w+)/g;
    const stack = [], names = new Set(); let pending = null, m;
    while ((m = tok.exec(src))) {
      const t = m[0];
      if (t === "{") { stack.push(pending); pending = null; }
      else if (t === "}") { if (stack.length) stack.pop(); pending = null; }
      else if (t === ";") pending = null;
      else { const name = m[1] || m[2]; names.add([...stack.filter(Boolean), name].join("::")); pending = name; }
    }
    return names;
  }
  function extractSysml(text) {
    const sec = sectionText(parse(text), SYSML_HEADING); if (sec === null) return null;
    const f = fences(sec); return f.length === 1 ? f[0][0] : null;
  }

  function validate(text, classes) {
    let n; try { n = parse(text); } catch (e) { return [{ code: e.message, message: "note has no YAML frontmatter" }]; }
    const out = [], m = n.meta, add = (code, message) => out.push({ code, message });
    const present = PROPERTY_ORDER.filter((k) => n.keys.includes(k));
    if (JSON.stringify(n.keys.slice(0, present.length)) !== JSON.stringify(present)) add("PROPERTY_ORDER", `leading keys must be ${present}`);
    for (const req of ["type", "id", "uid", "status", "tags"]) if (!n.keys.includes(req)) add("MISSING_PROPERTY", `\`${req}\` is required`);
    const cls = classes[m.type || ""];
    if ("type" in m && !cls) add("UNKNOWN_TYPE", `type \`${m.type}\` is not a class`);
    if (cls) {
      const subs = cls.subtype || [], sub = m.subtype || "";
      if (subs.length && !subs.includes(sub)) add("BAD_SUBTYPE", `subtype \`${sub}\` not allowed for ${m.type}`);
      if (!subs.length && sub) add("BAD_SUBTYPE", `${m.type} has no subtypes but subtype is \`${sub}\``);
    }
    if ("id" in m) {
      const idm = ID.exec(m.id);
      if (!idm) add("BAD_ID", `id \`${m.id}\` malformed`);
      else if (cls) {
        const want = (cls.prefixBySubtype && cls.prefixBySubtype[m.subtype || ""]) || cls.prefix;
        if (idm[1] !== want) add("ID_PREFIX", `id prefix \`${idm[1]}\` is not \`${want}\``);
      }
      if (m.fixture === "true" && idm && +idm[2] < FIXTURE_ID_MIN) add("FIXTURE_ID_RANGE", "fixture ids are 99000-99999");
      if (m.fixture !== "true" && idm && +idm[2] >= FIXTURE_ID_MIN) add("FIXTURE_ID_RANGE", "ids 99000-99999 are reserved for fixtures");
    }
    if ("uid" in m && !UID.test(m.uid)) add("BAD_UID", `uid \`${m.uid}\` malformed`);
    const sysHits = sectionOffsets(n, SYSML_HEADING), srcHits = sectionOffsets(n, SOURCE_HEADING);
    if (sysHits.length > 1) add("SYSML_SECTION_COUNT", `${sysHits.length} SysML sections`);
    if (srcHits.length && sysHits.length && srcHits[0][1] > sysHits[0][1]) add("SOURCE_AFTER_SYSML", "Source: EA must precede SysML v2");
    let block = null;
    if (sysHits.length) {
      if (sysHits[0][0] !== n.h2.length - 1) add("SYSML_NOT_LAST", `SysML v2 must be last; found \`${n.h2[n.h2.length - 1][1]}\` after it`);
      const f = fences(sectionText(n, SYSML_HEADING));
      if (f.length !== 1) add("SYSML_FENCE_COUNT", `expected one sysml block; found ${f.length}`);
      else { block = f[0][0]; if (!COMMENT_ONLY.test(f[0][1])) add("SYSML_TRAILING_CONTENT", "text after the sysml block"); }
    }
    const upto = sysHits.length ? sysHits[0][1] : n.text.length;
    const stray = fences(n.text.slice(n.fmEnd, upto)).length;
    if (stray) add("SYSML_OUTSIDE_FOOTER", `${stray} sysml block(s) above the SysML section`);
    const role = m.sourceRole, symbol = m.primarySymbol;
    if (role !== undefined && role !== "authoritative-model") add("BAD_SOURCE_ROLE", `sourceRole \`${role}\``);
    if ((role || symbol) && block === null) add("MISSING_SYSML_BLOCK", "sourceRole/primarySymbol set without a valid block");
    if (role === "authoritative-model" && !symbol) add("MISSING_PRIMARY_SYMBOL", "needs primarySymbol");
    if (symbol && block !== null && !qualifiedNames(block).has(symbol)) add("SYMBOL_NOT_DECLARED", `primarySymbol \`${symbol}\` not declared`);
    return out;
  }

  const renderSysmlSection = (sysml, nl = "\n") =>
    [SYSML_HEADING, "", SYSML_HINT, "", "```sysml", ...sysml.replace(/\r\n/g, "\n").replace(/\n+$/, "").split("\n"), "```"].join(nl) + nl;
  function replaceSysmlBlock(text, sysml) {
    const nl = text.includes("\r\n") ? "\r\n" : "\n", n = parse(text), hits = sectionOffsets(n, SYSML_HEADING);
    const section = renderSysmlSection(sysml, nl);
    if (hits.length) {
      const normOff = hits[0][1];
      const cut = normOff + (nl === "\r\n" ? (n.text.slice(0, normOff).match(/\n/g) || []).length : 0);
      return text.slice(0, cut) + section;
    }
    const hasFooter = n.h2.some(([, h]) => h === SOURCE_HEADING);
    return text.replace(/[\r\n]+$/, "") + nl.repeat(hasFooter ? 2 : 4) + section;
  }

  /* ---- rerun / add-onto-existing -------------------------------------------------
   * Ruleset 16.4: EA-owned content refreshes, human content is preserved.
   *   user zone       everything before the first managed heading: kept byte-for-byte
   *   frontmatter     id and uid never change; EA_OWNED_KEYS refresh; all other keys kept
   *   Source: EA      replaced
   *   SysML v2        replaced
   * A different `type` for the same uid is a CONFLICT and nothing is written. */
  function managedStart(n) {
    const hits = n.h2.filter(([, h]) => h === SOURCE_HEADING || h === SYSML_HEADING);
    return hits.length ? hits[0][0] : n.text.length;
  }
  function splitNote(text) {
    const n = parse(text), cut = managedStart(n);
    const head = n.text.slice(0, cut), footer = n.text.slice(cut);
    const srcHits = sectionOffsets(n, SOURCE_HEADING), sysHits = sectionOffsets(n, SYSML_HEADING);
    const srcText = sectionText(n, SOURCE_HEADING);
    return { n, head, footer, source: srcText ? srcText.replace(/\n+$/, "") : null, hasSysml: sysHits.length > 0, srcHits };
  }
  function patchFrontmatter(head, generatedMeta, generatedKeys) {
    const lines = head.split("\n"), log = [];
    const fmIdx = (key) => { const close = lines.indexOf("---", 1); for (let i = 1; i < close; i++) if (lines[i].startsWith(key + ":")) return i; return -1; };
    for (const key of EA_OWNED_KEYS) {
      if (!(key in generatedMeta)) continue;
      const line = `${key}: ${generatedMeta[key]}`, i = fmIdx(key);
      if (i >= 0) {
        if (lines[i] !== line) { log.push(`${key}: ${lines[i].slice(key.length + 2)} -> ${generatedMeta[key]}`); lines[i] = line; }
      } else {
        let at = lines.indexOf("---", 1);               // default: just before the closing fence
        for (let g = generatedKeys.indexOf(key) - 1; g >= 0; g--) { const j = fmIdx(generatedKeys[g]); if (j >= 0) { at = j + 1; break; } }
        lines.splice(at, 0, line); log.push(`${key}: (added) ${generatedMeta[key]}`);
      }
    }
    return { text: lines.join("\n"), log };
  }
  function mergeNote(existing, generated) {
    const nlE = existing.includes("\r\n") ? "\r\n" : "\n";
    const E = splitNote(existing), G = splitNote(generated);
    if (E.n.meta.uid !== G.n.meta.uid) return { action: "conflict", reason: "UID_MISMATCH", text: existing, log: [] };
    if (E.n.meta.type !== G.n.meta.type) return { action: "conflict", reason: `TYPE_CHANGED ${E.n.meta.type} -> ${G.n.meta.type}`, text: existing, log: [] };
    const patched = patchFrontmatter(E.head, G.n.meta, G.n.keys);
    const head = patched.text, log = patched.log;
    // Rebuild the footer from the generated note, in the existing note's line endings.
    const gFooterSrc = G.source, gSysml = extractSysml(generated);
    let out = head.replace(/\n+$/, "") ;
    const gap = "\n\n\n\n";
    if (gFooterSrc) out += gap + gFooterSrc + "\n\n" + renderSysmlSection(gSysml, "\n").replace(/\n$/, "") + "\n";
    else if (gSysml !== null) out += gap + renderSysmlSection(gSysml, "\n");
    else out += "\n";
    if (nlE === "\r\n") out = out.replace(/\n/g, "\r\n");
    return { action: out === existing ? "unchanged" : "merge", text: out, log };
  }
  const indexByUid = (files) => { const m = new Map(); for (const [path, text] of files) { try { const u = parse(text).meta.uid; if (u) m.set(u, path); } catch (_) {} } return m; };

  /* ---- ZIP (stored, no compression) ------------------------------------------- */
  let CRC = null;
  const crc32 = (b) => { if (!CRC) { CRC = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; CRC[n] = c >>> 0; } } let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

  /* ---- Narrow, human-initiated edits used by the Workbench Review (D-0025). They touch the frontmatter value or one flag
   * callout in the user zone, never `## Source: EA` or `## SysML v2`, and return the new text; the caller writes it. ---- */
  const FLAG_RE = /^> \[!(flag\w+)\] (.*)\n((?:>.*(?:\n|$))*)/gm;
  const crlf = (orig, text) => (orig.includes("\r\n") ? text.replace(/\n/g, "\r\n") : text);
  function setFrontmatterField(text, key, value) {
    const n = parse(text);
    if (!/^[A-Za-z][\w-]*$/.test(key)) return { text, changed: false, reason: "BAD_KEY" };
    const v = String(value).trim();
    if (/[\n\r]/.test(v)) return { text, changed: false, reason: "BAD_VALUE" };
    const quoted = v === "" ? "" : /^[\s'"]|[:#]\s|\s$|^[-?!&*|>%@`]/.test(v) ? JSON.stringify(v) : v;
    const fm = n.text.slice(4, n.fmBlockEnd), re = new RegExp(`^${key}:.*$`, "m");
    if (!re.test(fm)) return { text, changed: false, reason: "FIELD_MISSING" };
    const out = n.text.slice(0, 4) + fm.replace(re, quoted === "" ? `${key}:` : `${key}: ${quoted}`) + n.text.slice(n.fmBlockEnd);
    return { text: crlf(text, out), changed: out !== n.text, reason: "" };
  }
  function removeFlag(text, type, title, nth = 0) {
    const n = parse(text), zoneEnd = managedStart(n), zoneStart = n.fmEnd, zone = n.text.slice(zoneStart, zoneEnd);
    let i = 0, hit = null;
    for (const m of zone.matchAll(FLAG_RE)) { if (m[1] === type && m[2].trim() === String(title).trim()) { if (i === nth) { hit = m; break; } i++; } }
    if (!hit) return { text, removed: false, reason: "FLAG_NOT_FOUND" };
    let start = zoneStart + hit.index, end = start + hit[0].length;
    if (n.text.slice(end, end + 1) === "\n" && (start === 0 || n.text.slice(start - 1, start) === "\n")) end++;      // keep one blank line, not two
    const out = n.text.slice(0, start) + n.text.slice(end);
    return { text: crlf(text, out), removed: true, reason: "" };
  }

  function zip(entries) { // entries: [[path, Uint8Array]]
    const enc = new TextEncoder(), parts = [], central = []; let off = 0;
    const u16 = (v) => [v & 255, (v >>> 8) & 255], u32 = (v) => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
    for (const [path, data] of entries) {
      const name = enc.encode(path), crc = crc32(data);
      const local = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)]);
      parts.push(local, name, data);
      central.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), name);
      off += local.length + name.length + data.length;
    }
    const cdSize = central.reduce((s, x) => s + x.length, 0);
    const end = new Uint8Array([0x50, 0x4b, 5, 6, 0, 0, 0, 0, ...u16(entries.length), ...u16(entries.length), ...u32(cdSize), ...u32(off), 0, 0]);
    const all = [...parts, ...central, end], total = all.reduce((s, x) => s + x.length, 0), out = new Uint8Array(total); let p = 0;
    for (const x of all) { out.set(x, p); p += x.length; } return out;
  }
  return { SYSML_HEADING, SOURCE_HEADING, EA_OWNED_KEYS, parse, extractSysml, qualifiedNames, validate, renderSysmlSection, replaceSysmlBlock, mergeNote, indexByUid, crc32, zip, setFrontmatterField, removeFlag };
})();

</script>
<script>
const WB = (() => {
/* sysml_lang.ts */
/* Recognizes the SysML v2 textual notation by the language catalog (governance/language/catalog.json): which construct a
 * statement is, from its leading keywords. Not a parser: it classifies a statement head so nothing valid is reported as
 * unknown. Conformance is the pinned parser's job. Ids are the catalog's ids. */

const KINDS                          = [["part", "part"], ["attribute", "attribute"], ["item", "item"], ["port", "port"], ["connection", "connection"], ["interface", "interface"], ["allocation", "allocation"], ["flow", "flow"], ["occurrence", "occurrence"], ["individual", "individual"], ["action", "action"], ["state", "state"], ["constraint", "constraint"], ["requirement", "requirement"], ["concern", "concern"], ["calc", "calc"], ["case", "case"], ["analysis", "analysis"], ["verification", "verification"], ["use case", "use-case"], ["viewpoint", "viewpoint"], ["view", "view"], ["rendering", "rendering"], ["metadata", "metadata"], ["enum", "enum"]];
const KIND_RE = KINDS.map(([k]) => k).sort((a, b) => b.length - a.length).join("|");
const KIND_ID = new Map(KINDS);

const DEF_RE = new RegExp(`^(${KIND_RE})\\s+def\\b`);
const USAGE_RE = new RegExp(`^(${KIND_RE})\\b`);
const MOD_WORDS = /^(public|private|protected|abstract|variation|variant|readonly|derived|constant|ordered|nonunique|end|all)\b\s*/;

/** Construct ids a statement head belongs to (a head can be several: `abstract part def A :> B[1]` is a part-def, modifiers, specialization, multiplicity). */
function classify(head        )           {
  const ids           = [];
  const add = (id        )       => { if (!ids.includes(id)) ids.push(id); };
  let h = head.trim();
  if (!h) return ids;
  let m                        ;
  // prefix metadata, then visibility and modifiers
  while ((m = /^#[A-Za-z_][\w:]*\s*/.exec(h))) { add("prefix-metadata"); h = h.slice(m[0].length); }
  while ((m = MOD_WORDS.exec(h))) {
    if (/^(public|private|protected)$/.test(m[1] )) add("visibility"); else if (m[1] === "variation" || m[1] === "variant") add("variation"); else add("modifiers");
    h = h.slice(m[0].length);
  }
  if (/^@[A-Za-z_]/.test(h)) { add("metadata-feature"); return ids; }
  if ((m = /^(import)\s+(.+)$/.exec(h))) { add(/::\*{1,2}$/.test(m[2] ) ? "import-namespace" : "import-membership"); return ids; }
  if (/^alias\b/.test(h)) { add("alias"); return ids; }
  if (/^filter\b/.test(h)) { add("filter"); return ids; }
  if (/^comment\b/.test(h) || /^\/\*/.test(h)) { add("comment"); return ids; }
  if (/^doc\b/.test(h)) { add("documentation"); return ids; }
  if (/^rep\b/.test(h) || /^language\b/.test(h)) { add("textual-representation"); return ids; }
  if ((m = /^(library\s+)?package\b/.exec(h))) { add(m[1] ? "library-package" : "package"); return ids; }
  if (/^dependency\b/.test(h)) { add("dependency"); return ids; }
  if (/^expose\b/.test(h)) { add("expose"); return ids; }
  if (/^render\b/.test(h)) { add("render"); return ids; }
  if (/^frame\b/.test(h)) { add("framed-concern-usage"); return ids; }
  if (/^perform\b/.test(h)) { add("perform-action-usage"); return ids; }
  if (/^exhibit\b/.test(h)) { add("exhibit-state-usage"); return ids; }
  if (/^include\b/.test(h)) { add("include-use-case-usage"); return ids; }
  if (/^satisfy\b/.test(h)) { add("satisfy-requirement-usage"); return ids; }
  if (/^verify\b/.test(h)) { add("verify-requirement-usage"); return ids; }
  if (/^assert\b/.test(h)) { add("assert-constraint-usage"); return ids; }
  if (/^(assume|require)\b/.test(h)) { add("require-constraint-usage"); return ids; }
  if (/^allocate\b/.test(h)) { add("allocation-usage"); return ids; }
  if (/^connect\b/.test(h)) { add("connection-usage"); return ids; }
  if (/^bind\b/.test(h)) { add("bind"); return ids; }
  if (/^succession\s+flow\b/.test(h)) { add("succession-flow-usage"); return ids; }
  if (/^succession\b|^first\b/.test(h)) { add("succession"); return ids; }
  if (/^transition\b|^then\b|^accept\b.*\bthen\b/.test(h)) { if (/^transition\b/.test(h)) add("transition-usage"); else add("succession"); return ids; }
  if (/^message\b/.test(h)) { add("message"); return ids; }
  if (/^accept\b/.test(h)) { add("accept-action-usage"); return ids; }
  if (/^send\b/.test(h)) { add("send-action-usage"); return ids; }
  if (/^assign\b/.test(h)) { add("assign-action-usage"); return ids; }
  if (/^(decide|merge|fork|join)\b/.test(h)) { add("decision-node"); return ids; }
  if (/^if\b/.test(h)) { add("if-action-usage"); return ids; }
  if (/^(while|loop|for)\b/.test(h)) { add("loop-action-usage"); return ids; }
  if (/^terminate\b/.test(h)) { add("terminate-action-usage"); return ids; }
  if (/^(entry|do|exit)\b/.test(h)) { add("state-action"); return ids; }
  if (/^return\b/.test(h)) { add("return"); relations(h, add); return ids; }
  if (/^objective\b/.test(h)) { add("objective-usage"); return ids; }
  if (/^subject\b/.test(h)) { add("subject-usage"); relations(h, add); return ids; }
  if (/^actor\b/.test(h)) { add("actor-usage"); relations(h, add); return ids; }
  if (/^stakeholder\b/.test(h)) { add("stakeholder-usage"); relations(h, add); return ids; }
  if (/^event\b/.test(h)) { add("event-occurrence-usage"); return ids; }
  if (/^snapshot\b/.test(h)) { add("snapshot-usage"); relations(h, add); return ids; }
  if (/^timeslice\b/.test(h)) { add("timeslice-usage"); relations(h, add); return ids; }
  let dir = false;
  if ((m = /^(in|out|inout)\b\s*/.exec(h))) { add("parameter"); dir = true; h = h.slice(m[0].length); }
  if ((m = /^ref\b\s*/.exec(h))) { h = h.slice(m[0].length); if (!USAGE_RE.test(h)) { add("reference-usage"); relations(h, add); return ids; } add("reference-usage"); }
  if ((m = DEF_RE.exec(h))) { add(`${KIND_ID.get(m[1] ) }-def`); relations(h, add, true); return ids; }
  if ((m = USAGE_RE.exec(h))) { add(`${KIND_ID.get(m[1] ) }-usage`); relations(h, add); return ids; }
  if (dir) { relations(h, add); return ids; }
  if (/^(end\s+)?[A-Za-z_]\w*\s*(:|:>|:>>|::>|=|\[)/.test(h)) { relations(h, add); return ids; }   // a usage with no keyword: redefinition or short form
  if (/<=|>=|==|!=|&&|\|\||[-+*\/?<>]|\b(not|and|or|xor|implies)\b|\[[^\]]*\]|[A-Za-z_]\w*\.[A-Za-z_]/.test(h)) { add("expression"); return ids; }
  return ids;
}

/** The relationship, multiplicity and value forms inside a declaration. */
function relations(h        , add                      , isDef = false)       {
  if (/:>>|\bredefines\b/.test(h)) add("redefinition");
  if (/::>|\breferences\b/.test(h)) add("reference-subsetting");
  if (/(^|[^:>]):>(?![>:])|\bspecializes\b|\bsubsets\b/.test(h)) add(isDef ? "specialization" : "subsetting");
  if (/\bcrosses\b/.test(h)) add("cross-subsetting");
  if (/:\s*~/.test(h)) add("conjugation");
  if (/(^|[^:>]):(?![>:=])\s*[A-Za-z_~]|\bdefined by\b/.test(h) && !isDef) add("feature-typing");
  if (/\[[^\]]*\]/.test(h)) add("multiplicity");
  if (/(^|[^:<>=!])(:=|=)(?!=)/.test(h)) add("value");
}

/* sysml_scan.ts */
/* A recognizer for the SysML v2 subset the vault uses. It is NOT a SysML parser: it finds definitions, usages and the
 * statements the importer writes, and keeps anything else as `raw` so nothing is silently dropped. Conformance is the
 * pinned parser's job (the parser gate), not this file's. */

                                                                                          
                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                           
                                                                                                                                   

                                                                 

function stripComments(src        )         {
  // `// word` after a semicolon is a kind tag (the importer's dependency kinds); other comments are dropped.
  return src.replace(/\/\*[\s\S]*?\*\//g, " ").split("\n").map((l) => {
    const m = /^(.*?;)\s*\/\/\s*([A-Za-z]+)\s*$/.exec(l);
    if (m) return `${m[1]} @${m[2]}`;
    const i = l.indexOf("//");
    return i >= 0 ? l.slice(0, i) : l;
  }).join("\n");
}

function parseItems(s        , start        , close         )                                 {
  const items         = [];
  let i = start, head = "";
  const flush = (body               , endsWithSemi         )       => {
    const h = head.replace(/\s+/g, " ").trim();
    let tag = "";
    const m = /^\s*@([A-Za-z]+)/.exec(s.slice(i));
    if (m && endsWithSemi) { tag = m[1] ; i += m[0].length; }
    if (h || body) items.push({ head: h, body, tag });
    head = "";
  };
  while (i < s.length) {
    const c = s[i] ;
    if (c === "}") { if (close) { if (head.trim()) flush(null, false); return { items, end: i + 1 }; } i++; continue; }
    if (c === ";") { i++; flush(null, true); continue; }
    if (c === "{") { const inner = parseItems(s, i + 1, true); i = inner.end; flush(inner.items, false); continue; }
    head += c; i++;
  }
  if (head.trim()) flush(null, false);
  return { items, end: i };
}

const DEF = /^(?:(?:abstract|variation|public|private|protected)\s+)*(part|port|action|state|item|attribute|requirement|use case|verification|constraint|occurrence|interface|connection|allocation|enum|calc|analysis|view|viewpoint|concern|metadata|flow|rendering|individual|case)\s+def\s+([A-Za-z_]\w*)\s*(?::>\s*(.+))?$/;
const USAGE = /^(?:(in|out|inout)\s+)?(part|port|action|state|item|attribute|fork|join|ref part|ref item)\s+([A-Za-z_]\w*)\s*(?::\s*([A-Za-z_][\w:]*))?\s*(\[[^\]]*\])?$/;
const QN = "([A-Za-z_][\\w:.]*)";

function interpret(it      , d            )       {
  const handled = interpretOne(it, d);
  if (!handled) { if (it.head) d.raw.push(it.head); return; }
  if (it.body && !/^objective\b/.test(it.head)) for (const c of it.body) interpret(c, d);          // nested members of any construct
}

/** The statements the importer writes get their own record; returns false only for a head nothing recognizes. */
let DOCS           = [];
const docText = (head        )         => (DOCS[Number(/\d+$/.exec(head) [0])] ?? "").replace(/^\s*\*?\s?/gm, "").trim();
function interpretOne(it      , d            )          {
  const h = it.head;
  if (/^doc ~D\d+$/.test(h)) { for (const i of classify("doc")) if (!d.langs.includes(i)) d.langs.push(i); return true; }
  { const hm = /^(?:constraint|action|state|item|attribute)\s+([A-Za-z_]\w*)\b/.exec(h); const dc = hm && it.body?.find((c) => /^doc ~D\d+$/.test(c.head)); if (dc) d.notes[hm [1] ] = docText(dc.head); }
  for (const i of classify(h)) if (!d.langs.includes(i)) d.langs.push(i);
  let m                        ;
  const st = (s      )       => { d.stmts.push(s); };
  if (it.body && /^objective\b/.test(h)) {
    for (const c of it.body) { const v = new RegExp(`^verify\\s+(?:requirement\\s+)?${QN}$`).exec(c.head); if (v) { st({ kind: "verify", a: v[1] , text: c.head }); if (!d.langs.includes("verify-requirement-usage")) d.langs.push("verify-requirement-usage"); } else { for (const i of classify(c.head)) if (!d.langs.includes(i)) d.langs.push(i); if (!classify(c.head).length) d.raw.push(c.head); } }
    return true;
  }
  if ((m = USAGE.exec(h))) { d.usages.push({ kind: m[2] .replace("ref ", ""), name: m[3] , ...(m[4] ? { type: m[4] } : {}), ...(m[5] ? { mult: m[5] } : {}), ...(m[1] ? { dir: m[1] } : {}) }); return true; }
  if ((m = new RegExp(`^satisfy\\s+(?:requirement\\s+)?${QN}(?:\\s+by\\s+${QN})?$`).exec(h))) { st({ kind: "satisfy", a: m[1] , ...(m[2] ? { b: m[2] } : {}), text: h }); return true; }
  if ((m = new RegExp(`^allocate\\s+${QN}\\s+to\\s+${QN}$`).exec(h))) { st({ kind: "allocate", a: m[1] , b: m[2] , text: h }); return true; }
  if ((m = new RegExp(`^perform\\s+action\\s+([A-Za-z_]\\w*)\\s*:\\s*${QN}$`).exec(h))) { st({ kind: "perform", name: m[1] , b: m[2] , text: h }); return true; }
  if ((m = new RegExp(`^dependency\\s+from\\s+${QN}\\s+to\\s+${QN}$`).exec(h))) { st({ kind: "dependency", a: m[1] , b: m[2] , tag: it.tag || "dependsOn", text: h }); return true; }
  if ((m = /^succession\s+first\s+([\w.]+)(?:\s+if\s+([\w.]+))?\s+then\s+([\w.]+)$/.exec(h))) { st({ kind: "succession", a: m[1] , b: m[3] , ...(m[2] ? { guard: m[2] } : {}), text: h }); return true; }
  if ((m = /^transition\s+first\s+([\w.]+)(?:\s+accept\s+([\w.]+))?(?:\s+if\s+([\w.]+))?(?:\s+do\s+([\w.]+))?\s+then\s+([\w.]+)$/.exec(h))) { st({ kind: "transition", a: m[1] , b: m[5] , ...(m[2] ? { trigger: m[2] } : {}), ...(m[3] ? { guard: m[3] } : {}), ...(m[4] ? { effect: m[4] } : {}), text: h }); return true; }
  if ((m = /^connect\s+([\w.]+)\s+to\s+([\w.]+)$/.exec(h))) { st({ kind: "connect", a: m[1] , b: m[2] , text: h }); return true; }
  if ((m = new RegExp(`^include\\s+use case\\s+([A-Za-z_]\\w*)\\s*:\\s*${QN}$`).exec(h))) { st({ kind: "include", name: m[1] , b: m[2] , text: h }); return true; }
  if ((m = new RegExp(`^use case\\s+([A-Za-z_]\\w*)\\s*:\\s*${QN}\\s*(\\[[^\\]]*\\])?$`).exec(h))) { st({ kind: "optionalUseCase", name: m[1] , b: m[2] , tag: m[3] ?? "", text: h }); return true; }
  return classify(h).length > 0;
}

function scanSysml(block        )             {
  const warnings           = [];
  const defs               = [];
  DOCS = [];
  const pre = block.replace(/\bdoc\s*\/\*([\s\S]*?)\*\//g, (_m, t        ) => { DOCS.push(t); return `doc ~D${DOCS.length - 1};`; });
  const { items } = parseItems(stripComments(pre), 0, false);
  const langs           = [];
  const note = (ids          )       => { for (const i of ids) if (!langs.includes(i)) langs.push(i); };
  const walkPkg = (pkg        , kids        )       => {
    for (const k of kids) {
      const m = DEF.exec(k.head);
      if (!m) {
        const p = /^(?:library\s+)?(?:standard\s+)?package\s+([A-Za-z_]\w*)$/.exec(k.head);
        if (p && k.body) { note(classify(k.head)); walkPkg(pkg ? `${pkg}::${p[1]}` : p[1] , k.body); continue; }
        const ids = classify(k.head);
        if (ids.length) {                                            // a valid construct the vault has no view for yet: classified, kept, not reported
          note(ids);
          if (k.body) { const holder             = { keyword: "", pkg, name: "", symbol: "", specializes: [], usages: [], stmts: [], raw: [], notes: {}, langs: [] }; for (const c of k.body) interpret(c, holder); note(holder.langs); for (const r of holder.raw) warnings.push(`not recognized: ${r.slice(0, 80)}`); }
          continue;
        }
        if (k.head) warnings.push(`not recognized: ${k.head.slice(0, 80)}`);
        continue;
      }
      const d             = { keyword: `${m[1]} def`, pkg, name: m[2] , symbol: pkg ? `${pkg}::${m[2]}` : m[2] , specializes: m[3] ? m[3].split(",").map((x) => x.trim()).filter(Boolean) : [], usages: [], stmts: [], raw: [], notes: {}, langs: classify(k.head) };
      for (const c of k.body ?? []) { if (/^doc ~D\d+$/.test(c.head) && d.doc === undefined) d.doc = docText(c.head); interpret(c, d); }
      for (const r of d.raw) warnings.push(`${d.symbol}: not recognized: ${r.slice(0, 80)}`);
      note(d.langs);
      defs.push(d);
    }
  };
  walkPkg("", items);
  return { defs, warnings, langs };
}

/* index.ts */
/* The vault index: a disposable, in-memory picture built from the notes. It holds no model meaning of its own;
 * delete it and rebuild it from the files at any time. Relationships come from the SysML v2 text (and the few
 * MDSE-only YAML links); nothing here is read from a second store. */



                                                              
                
                                                                                                                                                   
                                                                                                                                                                    
                                                                    
 
/** `reverse` marks an edge whose SOURCE could not be resolved: `from` is the resolved end (the target), `toSymbol` is the unresolved source. */
                                                                                                                                                           
                                                    

                      
                                                                                                                  
                                                                    
                                                                                                   
 

                                                                                                                                                                     

const CORE_KEYS = new Set(["type", "subtype", "id", "uid", "status", "eaType", "tags", "sourceRole", "primarySymbol", "aliases", "fixture"]);
const FLAG = /^> \[!(flag\w+)\] (.*)\n((?:>.*(?:\n|$))*)/gm;
const baseName = (path        )         => path.split("/").pop() .replace(/\.md$/i, "");
const SYSML_TO_KIND                         = { part: "hasPart", port: "hasPort", action: "hasAction", state: "hasState", item: "hasFlow" };
const DEP_KIND                         = { derivedFrom: "derivedFrom", refines: "refines", trace: "trace", dependsOn: "dependsOn", uses: "uses" };

function readNote(path        , text        , o              )              {
  let n                               ;
  try { n = MDSE.parse(text); } catch { return null; }
  const m                         = n.meta;
  if (!m.type || !m.uid) return null;                                 // not a governed note
  const managed = n.h2.find(([, h]                  ) => h === "## Source: EA" || h === "## SysML v2");
  const zone = n.text.slice(n.fmEnd, managed ? managed[0] : n.text.length);
  const flags         = [];
  for (const f of zone.matchAll(FLAG)) flags.push({ type: f[1] , title: f[2] .trim(), detail: f[3] .split("\n").map((l        ) => l.replace(/^>\s?/, "")).join("\n").trim() });
  const body = zone.replace(FLAG, "").replace(/^# .*\n?/m, "").trim();
  const title = /^# (.+)$/m.exec(zone)?.[1]?.trim() ?? baseName(path);
  const src = MDSE.extractSysml(text)                 ;
  const srcText = n.text.slice((n.h2.find(([, h]                  ) => h === "## Source: EA") ?? [n.text.length])[0]);
  const sourceLines = srcText.startsWith("## Source: EA") ? srcText.split("\n").slice(1).filter((l        ) => l.startsWith("- ")) : [];
  const guid = sourceLines.map((l        ) => /^- EA GUID: (.+)$/.exec(l)?.[1]).find(Boolean)?.trim() ?? "";
  const links                = [];
  for (const [k, v] of Object.entries(m)) if (!CORE_KEYS.has(k)) for (const x of String(v).matchAll(/\[\[([^\]|#]+)/g)) links.push({ field: k, target: x[1] .trim() });
  let def                    = null, warnings           = [];
  if (src) { const sc = scanSysml(src); def = sc.defs[0] ?? null; warnings = sc.warnings; if (sc.defs.length > 1) warnings.push(`${sc.defs.length} definitions in one note`); }
  const issues = o.classes ? (MDSE.validate(text, o.classes)                           ).map((i) => i.code) : [];
  return { path, name: baseName(path), folder: path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "", meta: m, type: m.type, subtype: m.subtype ?? "", id: m.id ?? "", uid: m.uid, status: m.status ?? "",
    title, eaType: m.eaType ?? "", body, flags, sourceLines, guid, block: src, def, warnings, links, issues };
}

function link(ix            , e      )       {
  ix.edges.push(e);
  (ix.out.get(e.from) ?? ix.out.set(e.from, []).get(e.from) ).push(e);
  if (e.to) (ix.inn.get(e.to) ?? ix.inn.set(e.to, []).get(e.to) ).push(e);
}

function resolveAll(ix            )       {
  const sym = (s        )                => ix.bySymbol.get(s) ?? null;
  for (const n of ix.notes.values()) {
    const d = n.def;
    if (d) {
      const E = (kind        , target               , symbol        , label = "", detail = "", from = n.path)       =>
        link(ix, { from, to: target, toSymbol: symbol, kind, label, via: "sysml", detail });
      for (const s of d.specializes) E("specializes", sym(s), s);
      for (const u of d.usages) if (u.type) E(SYSML_TO_KIND[u.kind] ?? "has", sym(u.type), u.type, `${u.dir ? u.dir + " " : ""}${u.name}${u.mult ?? ""}`);
      for (const s of d.stmts) {
        if (s.kind === "satisfy") E("satisfies", sym(s.a ), s.a );
        else if (s.kind === "verify") E("verifies", sym(s.a ), s.a );
        else if (s.kind === "perform") E("performs", sym(s.b ), s.b , s.name ?? "");
        else if (s.kind === "include") E("includes", sym(s.b ), s.b , s.name ?? "");
        else if (s.kind === "optionalUseCase") E("extendedBy", sym(s.b ), s.b , s.name ?? "", s.tag ?? "");
        else if (s.kind === "allocate" || s.kind === "dependency") {
          const kind = s.kind === "allocate" ? "allocatedTo" : DEP_KIND[s.tag ?? ""] ?? "dependsOn", a = sym(s.a ), b = sym(s.b );
          if (a) E(kind, b, s.b , "", "", a);                                              // source known: normal edge, target may dangle
          else if (b) link(ix, { from: b, to: null, toSymbol: s.a , kind, label: "", via: "sysml", detail: "", reverse: true });   // source missing: never a self-loop
          else E(kind, null, s.b , "", "", n.path);
        }
      }
    }
    for (const l of n.links) { const t = ix.byName.get(l.target.toLowerCase()) ?? null; link(ix, { from: n.path, to: t, toSymbol: l.target, kind: l.field, label: "", via: "yaml", detail: "" }); }
  }
}

function newIndex()             {
  return { notes: new Map(), byId: new Map(), bySymbol: new Map(), byName: new Map(), edges: [], out: new Map(), inn: new Map(), parser: "not-run", parserText: "", skipped: 0, duplicates: [], builtMs: 0 };
}

function register(ix            , n      )       {
  ix.notes.set(n.path, n);
  if (n.id) { if (ix.byId.has(n.id)) ix.duplicates.push(`id ${n.id}: ${ix.byId.get(n.id)} and ${n.path}`); else ix.byId.set(n.id, n.path); }
  ix.byName.set(n.name.toLowerCase(), n.path);
  if (n.def) ix.bySymbol.set(n.def.symbol, n.path);
  if (n.meta.primarySymbol) ix.bySymbol.set(n.meta.primarySymbol, n.path);
}

function finish(ix            , o              , t0        )             {
  resolveAll(ix);
  const st = /Status:\s*\*\*([A-Z -]+)\*\*/.exec(o.parserReport ?? "")?.[1]?.trim().toLowerCase();
  ix.parser = st === "passed" || st === "pass" ? "passed" : st === "failed" || st === "fail" ? "failed" : "not-run";
  ix.parserText = o.parserReport ?? "";
  ix.builtMs = Date.now() - t0;
  return ix;
}

const isNote = (p        )          => /\.md$/i.test(p) && !/(^|\/)\.obsidian\//.test(p) && !/^99_System\//.test(p);

function buildIndex(files                     , o               = {})             {
  const t0 = Date.now(), ix = newIndex();
  for (const [p, t] of files) { if (!isNote(p)) continue; const n = readNote(p, t, o); if (n) register(ix, n); else ix.skipped++; }
  return finish(ix, o, t0);
}

/** Same result, built in slices so a large vault never freezes the window (staged startup, carried from V1). */
async function buildIndexAsync(files                     , o               = {}, onProgress                                        )                      {
  const t0 = Date.now(), ix = newIndex(), every = o.yieldEvery ?? 200, total = files.size;
  let i = 0;
  for (const [p, t] of files) {
    i++;
    if (isNote(p)) { const n = readNote(p, t, o); if (n) register(ix, n); else ix.skipped++; }
    if (i % every === 0) { onProgress?.(i, total); if (o.yieldFn) await o.yieldFn(); }
  }
  return finish(ix, o, t0);
}

const outgoing = (ix            , path        )         => ix.out.get(path) ?? [];
const incoming = (ix            , path        )         => ix.inn.get(path) ?? [];

/* views.ts */
/* Views over the index. Each function returns plain data; the page and the Obsidian shell draw it.
 * Ported from V1: view profiles are data (which relationship kinds to follow, in which direction), a traversal
 * with a node cap, and a drawn result that is presentation only. Rewritten for V2: the relationship kinds come
 * from the SysML v2 text, not from YAML fields. */


                                                                                                                                                          
const node = (path               , label        , kind = "", detail = "", qty = 1)           => ({ path, label, detail, kind, qty, children: [] });
const nm = (ix            , p               , fallback        )         => (p ? ix.notes.get(p)?.title ?? fallback : fallback);

/** "[3]" -> 3, "[0..1]" -> 1 (upper bound), "[*]" -> 1 (unknown). */
function qtyOf(label        )         {
  const m = /\[(\d+)(?:\.\.(\d+|\*))?\]/.exec(label);
  if (!m) return 1;
  if (m[2] && m[2] !== "*") return +m[2];
  return m[2] === "*" ? 1 : +m[1] ;
}

const OWNED = ["hasPart", "hasPort", "hasAction", "hasState", "hasFlow"];
const CONTAIN = ["hasPart", "hasPort", "hasAction", "hasState", "specializes"];

/* ---- Structure ------------------------------------------------------------------------------------------------ */
                                                                                                 
function structure(ix            , root        , maxDepth = 6, perParent = 40)                  {
  const walk = (p        , label        , kind        , mult        , stack          )           => {
    const n = ix.notes.get(p) ;
    const t = node(p, label || n.title, kind, mult, qtyOf(mult));
    if (stack.includes(p)) { t.cycle = true; return t; }
    if (stack.length >= maxDepth) return t;
    const kids = outgoing(ix, p).filter((e) => OWNED.includes(e.kind));
    for (const e of kids.slice(0, perParent)) t.children.push(!e.to ? node(null, e.label.replace(/\[.*$/, "").replace(/^(in|out|inout) /, ""), e.kind, `: ${e.toSymbol} (not in vault)`, qtyOf(e.label)) : walk(e.to, e.label.replace(/\[.*$/, "").replace(/^(in|out|inout) /, ""), e.kind, (/\[.*\]/.exec(e.label) ?? [""])[0], [...stack, p]));
    if (kids.length > perParent) t.more = kids.length - perParent;
    return t;
  };
  const n = ix.notes.get(root) ;
  const supers           = [], seen = new Set        ([root]);
  for (let cur = root, guard = 0; guard < 20; guard++) { const e = outgoing(ix, cur).find((x) => x.kind === "specializes" && x.to && !seen.has(x.to)); if (!e) break; supers.push(e.to ); seen.add(e.to ); cur = e.to ; }
  const subs = incoming(ix, root).filter((e) => e.kind === "specializes").map((e) => e.from);
  const untyped = (n.def?.usages ?? []).filter((u) => !u.type && u.kind !== "fork" && u.kind !== "join").map((u) => `${u.kind} ${u.name}`);
  return { tree: walk(root, n.title, "root", "", []), supers, subs, untyped };
}

/** Rolled-up parts list: how many of each definition sit under the root, multiplying through the assembly. */
function bom(ix            , root        , maxDepth = 12)                                                                     {
  const acc = new Map                                        ();
  const walk = (p        , mult        , depth        , stack          )       => {
    if (depth > maxDepth || stack.includes(p)) return;
    for (const e of outgoing(ix, p)) {
      if (e.kind !== "hasPart" || !e.to) continue;
      const q = mult * qtyOf(e.label), cur = acc.get(e.to);
      acc.set(e.to, { qty: (cur?.qty ?? 0) + q, depth: Math.min(cur?.depth ?? 99, depth) });
      walk(e.to, q, depth + 1, [...stack, p]);
    }
  };
  walk(root, 1, 1, []);
  return [...acc].map(([path, v]) => ({ path, title: nm(ix, path, path), ...v })).sort((a, b) => a.depth - b.depth || a.title.localeCompare(b.title));
}

/* ---- Where used ----------------------------------------------------------------------------------------------- */
                                                                                                                               
function whereUsed(ix            , target        , maxDepth = 8)                  {
  const roots           = [];
  const up = (p        , stack          )             => {
    const kids             = [];
    for (const e of incoming(ix, p)) {
      if (!CONTAIN.includes(e.kind)) continue;
      const c = node(e.from, nm(ix, e.from, e.from), e.kind, e.label, qtyOf(e.label));
      if (stack.includes(e.from)) c.cycle = true;
      else if (stack.length < maxDepth) c.children = up(e.from, [...stack, p]);
      if (!c.cycle && !c.children.length && !roots.includes(e.from)) roots.push(e.from);
      kids.push(c);
    }
    return kids;

/* ---- Requirements and traceability ----------------------------------------------------------------------------- */
                                                                                                                                                                                                                                                                                   
/** The requirement's wording: the `doc` in its SysML block (IMP-097); older notes fall back to the first body paragraph. */
function requirementText(n      )         { return (n.def?.doc ?? n.body.split(/\n\s*\n/)[0] ?? "").trim(); }
function isRequirement(n      )          { return n.type === "Requirement" || n.def?.keyword === "requirement def"; }
function traceMatrix(ix            )                                                                           {
  const rows             = [];
  for (const n of ix.notes.values()) {
    if (!isRequirement(n)) continue;
    const inn = incoming(ix, n.path), out = outgoing(ix, n.path);
    const from = (k        )           => inn.filter((e) => e.kind === k).map((e) => e.from);
    const to = (k        )           => out.filter((e) => e.kind === k && e.to).map((e) => e.to );
    const r           = { path: n.path, id: n.id, title: n.title, subtype: n.subtype, text: requirementText(n), status: n.status, satisfiedBy: from("satisfies"), verifiedBy: from("verifies"),
      derivedFrom: to("derivedFrom"), derives: from("derivedFrom"), refines: to("refines"), refinedBy: from("refines"), allocatedTo: [...from("allocatedTo")].concat(to("allocatedTo")), gaps: [] };
    if (!r.satisfiedBy.length) r.gaps.push("no satisfier");
    if (!r.verifiedBy.length) r.gaps.push("no verification");
    rows.push(r);
  }
  rows.sort((a, b) => a.id.localeCompare(b.id));
  return { rows, total: rows.length, satisfied: rows.filter((r) => r.satisfiedBy.length).length, verified: rows.filter((r) => r.verifiedBy.length).length };
}

/* ---- Behavior and states ---------------------------------------------------------------------------------------- */
                                                                                                   
                                                                                                                                                                                                                                                                                                                                                                                            
function behavior(ix            , path        )             {
  const n = ix.notes.get(path), d = n?.def;
  if (!n || !d) return { kind: "none", nodes: [], edges: [], unresolved: [], triggers: [], guards: [] };
  const flowKinds = new Set(["action", "state", "fork", "join"]);
  const nodes             = d.usages.filter((u) => flowKinds.has(u.kind)).map((u) => ({ name: u.name, kind: u.kind, type: u.type ?? "", path: u.type ? ix.bySymbol.get(u.type) ?? null : null, layer: 0 }));
  const names = new Set(nodes.map((x) => x.name));
  const edges                      = [], unresolved           = [];
  for (const s of d.stmts) if (s.kind === "succession" || s.kind === "transition") { if (names.has(s.a ) && names.has(s.b )) edges.push({ from: s.a , to: s.b , kind: s.kind }); else unresolved.push(s.text); }
  // layers: longest path from any start, cycle safe
  const layer = new Map                (nodes.map((x) => [x.name, 0]));
  for (let pass = 0; pass < nodes.length; pass++) { let moved = false; for (const e of edges) { const v = (layer.get(e.from) ?? 0) + 1; if (v > (layer.get(e.to) ?? 0) && v <= nodes.length) { layer.set(e.to, v); moved = true; } } if (!moved) break; }
  for (const x of nodes) x.layer = layer.get(x.name) ?? 0;
  const triggers = n.sourceLines.filter((l) => l.startsWith("- Trigger:")).map((l) => l.replace(/ — EA GUID.*$/, "").slice(2));
  const words = (nm         )         => (nm ? d.notes[nm] ?? nm : "");
  const guards = d.stmts.filter((s) => (s.kind === "succession" || s.kind === "transition") && (s.trigger || s.guard || s.effect))
    .map((s) => ({ from: s.a , to: s.b , kind: s.kind, trigger: words(s.trigger), guard: words(s.guard), effect: words(s.effect) }));
  const kind = nodes.some((x) => x.kind === "state") ? "states" : nodes.length ? "actions" : "none";
  return { kind, nodes, edges, unresolved, triggers, guards };
}

/* ---- Interfaces ------------------------------------------------------------------------------------------------- */
                                                                                                                                                                                                                                                  
function interfaces(ix            , path        )                  {
  const d = ix.notes.get(path)?.def;
  const res = (s         )                => (s ? ix.bySymbol.get(s) ?? null : null);
  const users = incoming(ix, path).filter((e) => e.kind === "hasPort").map((e) => e.from);
  if (!d) return { ports: [], flows: [], connections: [], users };
  return {
    ports: d.usages.filter((u) => u.kind === "port").map((u) => ({ name: u.name, type: u.type ?? "", path: res(u.type) })),
    flows: d.usages.filter((u) => u.kind === "item").map((u) => ({ name: u.name, dir: u.dir ?? "", type: u.type ?? "", path: res(u.type) })),
    connections: d.stmts.filter((s) => s.kind === "connect").map((s) => ({ from: s.a , to: s.b  })), users,
  };
}

/** What the person chose to see. Empty lists mean "no restriction". Presentation only: it never changes the model. */
                                                                           
                                                                                                                                                                                            
const defaultSpec = (p          )           => ({ kinds: [], hideTypes: [], hideStatuses: [], folder: "", depth: p?.depth ?? 2, cap: p?.cap ?? 80, collapse: "", collapseOver: 6, ghosts: true });

const classOf = (n      , by            )         => by === "type" ? n.type : by === "subtype" ? (n.subtype ? `${n.type}/${n.subtype}` : n.type) : by === "status" ? n.status || "no status" : by === "folder" ? n.folder || "(root)" : by === "eaType" ? n.eaType || "no EA type" : "";

                                                                      
                                                                                                                                                       

function traverse(ix            , start        , p         , depth = p.depth, cap = p.cap, spec                    )              {
  const sp = { ...defaultSpec(p), ...spec };
  const seen = new Map                ([[start, 0]]), edges         = [], used = new Set      ();
  let frontier = [start], capped = false, hidden = 0;
  const allow = (e      , dir              )          => sp.kinds.length ? sp.kinds.includes(e.kind) : !p.steps.length || p.steps.some((s) => s.kind === e.kind && s.dir === dir);
  const visible = (path        )          => { const n = ix.notes.get(path); return !!n && !sp.hideTypes.includes(n.type) && !sp.hideStatuses.includes(n.status || "no status") && (!sp.folder || n.folder === sp.folder || n.folder.startsWith(sp.folder.replace(/\/$/, "") + "/")); };
  for (let d = 1; d <= depth && frontier.length; d++) {
    const next           = [];
    for (const cur of frontier) {
      for (const [list, dir] of [[outgoing(ix, cur), "out"], [incoming(ix, cur), "in"]]                                 ) {
        for (const e of list) {
          if (!allow(e, dir) || !e.to || used.has(e)) continue;
          const other = dir === "out" ? e.to : e.from;
          if (!seen.has(other)) {
            if (!visible(other)) { hidden++; continue; }
            if (seen.size >= cap) { capped = true; continue; }
            seen.set(other, d); next.push(other);
          }
          used.add(e); edges.push(e);
        }

    }
    frontier = next;
  }

}

/** Classifier grouping: at each distance from the start, notes that share a class collapse into one card once there are more than `collapseOver` of them. */
function collapseGraph(ix            , g             , sp          )              {

  for (const n of g.nodes) { if (n.depth === 0) continue; const note = ix.notes.get(n.path); if (!note) continue; const k = `${n.depth}\u0000${classOf(note, sp.collapse)}`; (buckets.get(k) ?? buckets.set(k, []).get(k) ).push(n.path); }

  for (const [k, members] of buckets) {

    const [d, label] = k.split("\u0000")                    , id = `group:${d}:${label}`;
    groups.set(id, { label, members, type: ix.notes.get(members[0] )?.type ?? "" });
    for (const m of members) into.set(m, id);
  }
  if (!groups.size) return g;
  const nodes = g.nodes.filter((n) => !into.has(n.path)).concat([...groups].map(([id]) => ({ path: id, depth: +id.split(":")[1]  })));

    const from = map(e.from), to = map(e.to );
    if (from === to) continue;
    const key = `${from}\u0000${to}\u0000${e.kind}`, cur = merged.get(key);

  }

}

                                                                      
/** Concentric rings around the start; presentation only. */
function layoutRadial(g             , ringGap = 150)           {

  for (const n of g.nodes) (byDepth.get(n.depth) ?? byDepth.set(n.depth, []).get(n.depth) ).push(n.path);

    if (d === 0) { out.push({ path: list[0] , x: 0, y: 0, depth: 0 }); continue; }
    const r = Math.max(ringGap * d, (list.length * 120) / (2 * Math.PI));
    list.forEach((p, i) => { const a = (2 * Math.PI * i) / list.length - Math.PI / 2; out.push({ path: p, x: Math.round(r * Math.cos(a)), y: Math.round(r * Math.sin(a)), depth: d }); });

/* ---- Tables, relationships, search, folders ----------------------------------------------------------------------- */
                                                                                                                                               
                                                                                                                                                                                                        
function tableRows(ix            , f              = {})             {
  const q = (f.text ?? "").toLowerCase();
  const rows             = [];
  for (const n of ix.notes.values()) {
    if (f.type && n.type !== f.type) continue;
    if (f.status && n.status !== f.status) continue;
    if (f.flagged && !n.flags.length) continue;
    const dangling = outgoing(ix, n.path).filter((e) => !e.to).length;
    if (f.unresolved && !dangling) continue;
    if (q && !`${n.id} ${n.title} ${n.name} ${n.def?.symbol ?? ""} ${n.type} ${n.subtype} ${n.folder}`.toLowerCase().includes(q)) continue;
    rows.push({ path: n.path, id: n.id, type: n.type, subtype: n.subtype, title: n.title, status: n.status, folder: n.folder, flags: n.flags.length, block: !!n.block, out: outgoing(ix, n.path).length, inn: incoming(ix, n.path).length, dangling });
  }
  const k = (f.sort ?? "id")                  ;
  rows.sort((a, b) => { const x = a[k], y = b[k]; const c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y)); return f.desc ? -c : c; });

}

                                                                                                                                                            
function relationshipRows(ix            , kinds           = [], text = "")           {
  const q = text.toLowerCase();
  const rows           = [];

    if (kinds.length && !kinds.includes(e.kind)) continue;
    const fromTitle = e.reverse ? e.toSymbol : nm(ix, e.from, e.from), toTitle = e.reverse ? nm(ix, e.from, e.from) : e.to ? nm(ix, e.to, e.to) : e.toSymbol;
    if (q && !`${fromTitle} ${toTitle} ${e.kind} ${e.label}`.toLowerCase().includes(q)) continue;
    rows.push(e.reverse ? { from: null, fromTitle, kind: e.kind, to: e.from, toTitle, label: e.label, via: e.via, resolved: false }
      : { from: e.from, fromTitle, kind: e.kind, to: e.to, toTitle, label: e.label, via: e.via, resolved: !!e.to });

}
const edgeKinds = (ix            )                          => { const m = new Map                (); for (const e of ix.edges) m.set(e.kind, (m.get(e.kind) ?? 0) + 1); return [...m].sort((a, b) => b[1] - a[1]); };

function folderTree(ix            )           {
  const root = node(null, "(vault)", "folder");
  const dirs = new Map                  ([["", root]]);
  const dir = (p        )           => {
    const hit = dirs.get(p); if (hit) return hit;
    const parent = dir(p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "");
    const t = node(null, p.split("/").pop() , "folder"); parent.children.push(t); dirs.set(p, t); return t;
  };
  const sorted = [...ix.notes.values()].sort((a, b) => a.path.localeCompare(b.path));
  for (const n of sorted) dir(n.folder).children.push(node(n.path, n.title, n.type, n.id));
  const order = (t          )       => { t.children.sort((a, b) => (a.kind === "folder" ? 0 : 1) - (b.kind === "folder" ? 0 : 1) || a.label.localeCompare(b.label)); t.children.forEach(order); };
  order(root);
  return root;
}

/* ---- Review and dashboard ----------------------------------------------------------------------------------------- */
                                                                                                                                                                                                                                                                 
function reviewQueue(ix            )               {
  const out               = [];
  for (const n of ix.notes.values()) {
    const seenFlag = new Map                ();
    for (const f of n.flags) { const k = f.type + "\u0000" + f.title, nth = seenFlag.get(k) ?? 0; seenFlag.set(k, nth + 1); out.push({ severity: f.type === "flagConflict" ? "high" : f.type === "flagNote" ? "low" : "medium", category: f.type, path: n.path, message: f.title, flag: { type: f.type, title: f.title, nth } }); }
    if (n.type === "Issue" && n.status !== "Retired") out.push({ severity: "medium", category: "issue", path: n.path, message: n.title, status: n.status || "(none)" });
    for (const w of n.warnings) out.push({ severity: "medium", category: "sysml-not-recognized", path: n.path, message: w });
    for (const i of n.issues) out.push({ severity: "high", category: "format:" + i, path: n.path, message: i });
    for (const e of outgoing(ix, n.path)) if (!e.to && e.via === "sysml") out.push({ severity: "medium", category: "unresolved-reference", path: n.path, message: e.reverse ? `${e.kind} from ${e.toSymbol} (source not in vault)` : `${e.kind} → ${e.toSymbol}` });
  }
  for (const d of ix.duplicates) out.push({ severity: "high", category: "duplicate-id", path: "", message: d });

  return out.sort((a, b) => rank[a.severity] - rank[b.severity] || a.category.localeCompare(b.category) || a.path.localeCompare(b.path));
}

                                                                                                                                                                                                                                                                                                                                                         
function dashboard(ix            )            {
  const count = (f                       )                          => { const m = new Map                (); for (const n of ix.notes.values()) for (const k of f(n)) m.set(k, (m.get(k) ?? 0) + 1); return [...m].sort((a, b) => b[1] - a[1]); };

  for (const n of ix.notes.values()) { if (!outgoing(ix, n.path).length && !incoming(ix, n.path).length) orphans++; warnings += n.warnings.length; }
  return { notes: ix.notes.size, blocks: [...ix.notes.values()].filter((n) => n.block).length, byType: count((n) => [n.type]), byStatus: count((n) => [n.status || "(none)"]), flags: count((n) => n.flags.map((f) => f.type)),
    edgeKinds: edgeKinds(ix), dangling: ix.edges.filter((e) => !e.to && e.via === "sysml").length, orphans, warnings, parser: ix.parser, skipped: ix.skipped, requirements: { total: t.total, satisfied: t.satisfied, verified: t.verified } };
}

function search(ix            , q        , limit = 50)         {
  const s = q.trim().toLowerCase(); if (!s) return [];
  const hits                        = [];
  for (const n of ix.notes.values()) {
    const id = n.id.toLowerCase(), t = n.title.toLowerCase();

/* ---- Functional trace ------------------------------------------------------------------------------------------- */
                                                                                                                                                                                                                                                           
function functionalTrace(ix            )            {

    const performedBy = uniq(inn.filter((e) => (e.kind === "performs" || e.kind === "hasAction") && e.to).map((e) => e.from));
    const direct = uniq(out.filter((e) => e.kind === "satisfies" && e.to).map((e) => e.to ));

const funcRelated = (r         , sel        )          => r.path === sel || [r.performedBy, r.satisfies, r.satisfiesViaPerformer, r.verifiedBy, r.allocatedTo].some((l) => l.includes(sel));
const traceRelated = (r          , sel        )          => r.path === sel || [r.satisfiedBy, r.verifiedBy, r.derivedFrom, r.derives, r.refines, r.refinedBy, r.allocatedTo].some((l) => l.includes(sel));

/* ---- Lenses: the same data as plain tables, for the narrow panel and the main window ------------------------------ */
                                                                                                              
const LENSES                        = [["dashboard", "Dashboard"], ["note", "Note"], ["tables", "Tables"], ["structure", "Structure trace"], ["functional", "Functional trace"], ["requirements", "Requirements trace"], ["review", "Review"], ["edit", "Edit"]];

function lensTables(ix            , lens      , sel        , o              = {})              {
