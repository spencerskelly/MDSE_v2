name: Temporary Workbench pop-out artifact rebuild
on:
  push:
    branches:
      - feature/workbench-popout-current-main-20261119
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Rebuild and check generated plugin and importer
        run: |
          npm run build:workbench
          npm run build:importer
          npm run check:workbench
          npm run check:importer
          npm run test:workbench
      - name: Commit generated artifacts to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/workbench/dist tools/importer/dist
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate workbench and importer release artifacts"
            git push origin HEAD:feature/workbench-popout-current-main-20261119
          fi
