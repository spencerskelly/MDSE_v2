# D-0070 release rebuild: compile importer from corrected flagLink/PROVISIONAL_LINK source and run unit tests.
name: Rebuild MDSE importer release
on:
  push:
    paths:
      - '.github/workflows/rebuild-importer-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild Workbench and embedded importer
        run: npm run build
      - name: Validate generated release and functional tests
        run: |
          npm run test:workbench
          npm run test:bootstrap
          npm run test:importer
          npm run check:workbench
          npm run check:importer
      - name: Commit refreshed artifacts on main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/workbench/dist tools/importer/dist tools/importer/TRANSLATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild importer and Workbench release from current main'
            git push origin HEAD:main
          fi
